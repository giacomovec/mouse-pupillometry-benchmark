name: Verify benchmark site pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check exported evidence and referenced media
        run: python3 export/build_benchmark_data.py --verify-export-only --output-dir public/data
      - name: Test standalone export structure
        run: python3 -m unittest discover -s export/tests -p 'test_*.py'
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Check built evidence and referenced media
        run: python3 export/build_benchmark_data.py --verify-export-only --output-dir dist/data
